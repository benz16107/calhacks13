# gitleaks: the default rules, minus two kinds of known false positive (checked by hand in release/audit.md).
[extend]
useDefault = true

[allowlist]
description = "Idempotency keys in the docs' log examples, and the Figma file key"
regexTarget = "match"
regexes = [
  '''key":"mcp\.[a-z-]+\.[a-z]+\.[0-9a-f]{12}\.\d+"''',
  '''key for MCP calls: `[A-Za-z0-9]{22}`''',
]
