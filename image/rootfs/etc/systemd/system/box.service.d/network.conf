# Both editions: the box listens on every address, so phones on the same network can pair, and tells them its
# own address (BOX_URL, for the pairing QR code). The firewall (/etc/nftables.conf) lets in private networks only.
[Service]
ExecStartPre=/usr/local/lib/box-os/box-env
EnvironmentFile=-/run/box-os/box.env
