# The boot menu, on the ESP (hidden unless Shift is held). box-install writes it once (with @NAME@ filled in); system updates never change it.
# Slots A and B each hold a whole system. grubenv, beside this file, picks which one starts:
#   saved_entry  the slot that starts normally. box-update sets it once a new system proves healthy.
#   next_entry   a slot to try once. box-update sets it after writing an update; GRUB clears it on use, so if the
#                new system does not come up healthy, the next start is the old one again.
insmod all_video
insmod part_gpt
insmod fat
insmod ext2
insmod gfxterm
insmod gfxterm_background
if loadfont $prefix/fonts/gurtos.pf2; then
  loadfont $prefix/fonts/unicode.pf2
  set gfxmode=1280x800,1024x768,800x600,auto
  set gfxterm_font="DejaVu Sans Mono Regular 22"
  terminal_output gfxterm
  background_color 39,49,63
fi
search --no-floppy --label BOX-ESP --set=esp
set envfile=($esp)/boot/grub/grubenv
load_env --file $envfile
set default=$saved_entry
if [ -z "$default" ]; then set default=a; fi
if [ -n "$next_entry" ]; then
  set default=$next_entry
  set next_entry=
  save_env --file $envfile next_entry
fi
# The menu stays hidden, so every start goes straight to the boot splash. Hold Shift to see it.
set timeout_style=hidden
set timeout=0
if keystatus --shift; then
  set timeout_style=menu
  set timeout=-1
fi
set opts="rw quiet splash plymouth.ignore-serial-consoles panic=10 console=ttyS0,115200 console=ttyAMA0,115200 console=tty1"
export opts

menuentry "@NAME@, system A" --id a {
  search --no-floppy --label box-a --set=root
  linux /boot/vmlinuz root=LABEL=box-a box.slot=a $opts
  initrd /boot/initrd.img
}
menuentry "@NAME@, system B" --id b {
  search --no-floppy --label box-b --set=root
  linux /boot/vmlinuz root=LABEL=box-b box.slot=b $opts
  initrd /boot/initrd.img
}
