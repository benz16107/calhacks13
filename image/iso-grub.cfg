# The install disc's menu (image/build fills in @NAME@). With no GurtOS on a disk it installs after 5 seconds; with
# GurtOS on a disk it starts that after 30. A countdown on a plain screen shows it, and only Esc stops it, so a stray
# key does not leave the machine waiting forever. Esc opens the menu.
# The installer erases a disk that has anything on it only after you type "erase" on the screen.
insmod all_video
# UEFI GRUB loads none of these by itself, and without them it cannot see the installed disk.
insmod part_gpt
insmod fat
insmod ext2
# The screen: the box's colour, and a large font (image/build makes it from DejaVu Sans).
insmod gfxterm
insmod gfxterm_background
if loadfont $prefix/fonts/gurtos.pf2; then
  loadfont $prefix/fonts/unicode.pf2
  set gfxmode=1280x800,1024x768,800x600,auto
  set gfxterm_font="DejaVu Sans Regular 28"
  terminal_output gfxterm
  background_color 39,49,63
fi
set color_normal=white/black
set color_highlight=black/white
search --no-floppy --label BOX-ESP --set=boxdisk
set opts="boot=boxlive quiet console=ttyS0,115200 console=ttyAMA0,115200 console=tty1"
export opts boxdisk

if [ -n "$boxdisk" ]; then
  set default=disk
  # A cloud console (Vultr's) takes about 30 s to reconnect after a restart, and this is the only way to choose Install.
  set wait=30
  # Straight after an install the disc may still be in the drive. The new system has not started yet, and its
  # grubenv says so (box-update clears the flag at its first healthy start).
  load_env --file ($boxdisk)/boot/grub/grubenv just_installed
  if [ "$just_installed" = 1 ]; then set wait=3; fi
  set what="Starting @NAME@ from this computer's disk"
else
  set default=install
  set wait=5
  set what="Installing @NAME@ on this computer's disk (it erases the whole disk)"
fi
clear
echo ""
echo ""
echo "  @NAME@ @VERSION@"
echo ""
echo "  $what in $wait seconds."
echo "  Press Esc to choose something else."
if [ -z "$boxdisk" ]; then echo "  A disk with files on it asks you before it is erased."; fi
echo ""
if sleep --interruptible --verbose $wait; then
  set timeout=0
else
  set timeout=-1
fi

if [ -n "$boxdisk" ]; then
  menuentry "Start @NAME@ on this computer's disk" --id disk {
    set root=$boxdisk
    configfile /boot/grub/grub.cfg
  }
fi
menuentry "Install @NAME@ (erases the whole disk)" --id install {
  clear
  echo ""
  echo "  Starting the @NAME@ installer. The screen stays dark for a minute or two."
  linux /boot/vmlinuz $opts box.install
  initrd /boot/initrd.img
}
menuentry "Try @NAME@ from this disc (nothing is saved)" --id live {
  linux /boot/vmlinuz $opts
  initrd /boot/initrd.img
}
