# The install disc's menu. If this machine already has the box on a disk, start that; if not, install it.
# The installer erases a disk that has anything on it only after you type "erase" on the screen.
insmod all_video
# UEFI GRUB loads none of these by itself, and without them it cannot see the installed disk.
insmod part_gpt
insmod fat
insmod ext2
set timeout=5
search --no-floppy --label BOX-ESP --set=boxdisk
if [ -n "$boxdisk" ]; then set default=disk; else set default=install; fi
set opts="boot=boxlive quiet console=ttyS0,115200 console=ttyAMA0,115200 console=tty1"
export opts boxdisk

if [ -n "$boxdisk" ]; then
  menuentry "Start the box on this machine's disk" --id disk {
    set root=$boxdisk
    configfile /boot/grub/grub.cfg
  }
fi
menuentry "Install the box on this machine's disk" --id install {
  linux /boot/vmlinuz $opts box.install
  initrd /boot/initrd.img
}
menuentry "Try the box from this disc (nothing is saved)" --id live {
  linux /boot/vmlinuz $opts
  initrd /boot/initrd.img
}
