<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"edition","type":"enum","label":"Edition","default":"server","options":[{"value":"server","label":"GurtOS Server"},{"value":"personal","label":"GurtOS Personal"},{"value":"business","label":"GurtOS Business"}]},
    {"id":"color-ground","type":"color","label":"Night ground","default":"#171e25"},
    {"id":"color-ink","type":"color","label":"Text","default":"#f2efe8"},
    {"id":"color-ink-2","type":"color","label":"Secondary text","default":"#b9c0c8"},
    {"id":"color-accent","type":"color","label":"Accent (you can act)","default":"#8db4dd"},
    {"id":"color-attention","type":"color","label":"Amber (needs you)","default":"#f2b544"},
    {"id":"color-blocked","type":"color","label":"Blocked","default":"#f0a493"},
    {"id":"font-display","type":"string","label":"Typeface","default":"Atkinson Hyperlegible Next"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 400; src: url("assets/fonts/atkinson-hyperlegible-next-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 700; src: url("assets/fonts/atkinson-hyperlegible-next-latin-700-normal.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--color-ground, #171e25); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display), sans-serif; }
    </style>
  </head>
  <body>
    <!-- The 10-second pipeline test: title card, a real product clip, a lower third, captions and Ben's cloned voice.
         Each finished video copies this root and mounts its own scenes in the same tracks. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html"
        data-start="0" data-duration="4.2" data-track-index="1" data-track-kind="graphics"
        data-width="1920" data-height="1080"></div>

      <div id="footage" data-composition-id="footage" data-composition-src="compositions/footage.html"
        data-start="4.1" data-duration="5.9" data-track-index="2" data-track-kind="graphics"
        data-width="1920" data-height="1080"
        data-variable-values='{"src":"assets/footage/moment-3-approval.mp4","note":"Real GurtOS screen recording"}'></div>

      <div id="lower-third" data-composition-id="lower-third" data-composition-src="compositions/lower-third.html"
        data-start="4.7" data-duration="4.8" data-track-index="3" data-track-kind="graphics"
        data-width="1920" data-height="1080"
        data-variable-values='{"lt-title":"A pause for your OK","lt-kicker":"Moment 3 · GurtOS Server"}'></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html"
        data-start="0" data-duration="10" data-track-index="4" data-track-kind="captions"
        data-width="1920" data-height="1080"></div>

      <audio id="vo" class="clip" src="assets/vo/sample-gurt-os.wav" data-start="0.8" data-duration="6.0"
        data-track-index="5" data-volume="1.531087"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
