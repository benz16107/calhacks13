<template>
  <style>
    @font-face { font-family: "Atkinson Hyperlegible Next"; font-weight: 600; src: url("assets/fonts/atkinson-hyperlegible-next-latin-600-normal.woff2") format("woff2"); }
    #root { position: absolute; inset: 0; pointer-events: none; }
    /* GurtOS captions: one calm group at a time on a night pill (scrim sized to the text), the spoken word in full ink. */
    .cap { position: absolute; left: 0; right: 0; bottom: 84px; display: flex; justify-content: center; opacity: 0; overflow: visible; }
    .cap span.pill { padding: 10px 26px 14px; border-radius: 12px; background: rgba(23, 30, 37, 0.78); font-family: "Atkinson Hyperlegible Next", sans-serif; font-weight: 600; font-size: 50px; line-height: 1.2; color: rgba(242, 239, 232, 0.62); white-space: nowrap; }
    .cap b { font-weight: 600; }
  </style>
  <div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
    <!-- Groups are written from the narration's word timings (npx hyperframes transcribe), shifted by the voice clip's start. -->
    <div id="cap-0" class="cap clip" data-start="0.85" data-duration="1.6" data-track-index="0"><span class="pill"><b>GurtOS</b> <b>is</b> <b>an</b> <b>operating</b> <b>system</b></span></div>
    <div id="cap-1" class="cap clip" data-start="2.4" data-duration="1.7" data-track-index="0"><span class="pill"><b>where</b> <b>AI</b> <b>agents</b> <b>work</b> <b>safely.</b></span></div>
    <div id="cap-2" class="cap clip" data-start="4.15" data-duration="1.75" data-track-index="0"><span class="pill"><b>Every</b> <b>task</b> <b>runs</b> <b>as</b> <b>its</b> <b>own</b> <b>user,</b></span></div>
    <div id="cap-3" class="cap clip" data-start="5.9" data-duration="1.3" data-track-index="0"><span class="pill"><b>with</b> <b>no</b> <b>keys.</b></span></div>
  </div>
  <script>
    (function () {
      // Word start and end times, absolute seconds (voice starts at 0.8 s).
      const words = [[0.86,1.17],[1.17,1.29],[1.29,1.40],[1.40,1.98],[1.98,2.40],[2.40,2.58],[2.58,2.73],[2.73,3.17],[3.26,3.52],[3.52,4.00],[4.17,4.37],[4.37,4.60],[4.67,4.97],[4.97,5.12],[5.12,5.33],[5.33,5.56],[5.56,5.86],[5.86,6.15],[6.15,6.31],[6.31,6.64]];
      const tl = gsap.timeline({ paused: true });
      let w = 0;
      document.querySelectorAll("#root .cap").forEach((cap) => {
        const start = parseFloat(cap.dataset.start), end = start + parseFloat(cap.dataset.duration);
        tl.fromTo(cap, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.16, ease: "power2.out" }, start);
        cap.querySelectorAll("b").forEach((b) => {
          const [ws] = words[w++];
          tl.fromTo(b, { color: "rgba(242, 239, 232, 0.62)" }, { color: "#f2efe8", duration: 0.08 }, ws);
        });
        tl.to(cap, { opacity: 0, duration: 0.12, ease: "power2.in" }, end - 0.12);
        tl.set(cap, { opacity: 0, visibility: "hidden" }, end);
      });
      window.__timelines["captions"] = tl;
    })();
  </script>
</template>
