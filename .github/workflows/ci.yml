# What CI checks on every pull request and every push to main:
#   npm ci, the unit tests, the type check, the public-repo check (no keys, machine names, addresses or private
#   emails in committed files) and gitleaks over the whole history.
#
# What it does NOT run: ./demo, the merge gate. The gate installs the box on an Ubuntu 24.04 machine with root,
# creates Linux users, firewall rules and systemd units, and some steps spend model credit, so it needs our own
# test machines. Run it on a VM before merging anything the box does (see CONTRIBUTING.md). A green CI run means the
# repository is tidy and compiles; it does not mean the four demo moments work.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks reads every commit

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install gitleaks
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL "$base/$file" -o "$RUNNER_TEMP/$file"
          curl -fsSL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $file\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
          sudo install -m 755 "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: Public-repo check (private details, and gitleaks on the files)
        run: node release/check.ts

      - name: gitleaks over all history
        run: gitleaks git --log-opts=--all --redact --no-banner .
