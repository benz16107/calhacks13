<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find</title>
<link rel="stylesheet" href="/kit/gurtos.css">
<script type="module" src="/kit/gurtos.js"></script>
<style>
  main { max-width: 960px; margin: 0 auto; padding: var(--space-lg); }
  .g-search { margin-bottom: var(--space-md); }
  .g-search input { width: 100%; }
  .g-group { margin-top: var(--space-md); }
  .photos { display: grid; gap: var(--space-md); grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  .photos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: var(--radius-sm); display: block; background: var(--color-view-bg); }
  .photos .g-card { padding: var(--space-sm); }
  .g-row-title, .g-row-sub, .photos p { overflow-wrap: anywhere; }
  .photos p { margin: var(--space-xs) 0 0; }
  footer { margin-top: var(--space-lg); }
</style>
<body class="g-page">
<main>
  <form role="search" id="form" class="g-search">
    <g-icon name="system-search"></g-icon>
    <label class="g-sr" for="q">Search this box</label>
    <input id="q" class="g-field" type="search" placeholder="Find the whiteboard photo" autocomplete="off" autofocus>
  </form>
  <div id="describe" class="g-banner" hidden><g-icon name="dialog-information"></g-icon><div><span id="describe-text"></span> <button class="g-btn" id="describe-btn" type="button">Describe with Claude</button></div></div>
  <div id="results" aria-live="polite"></div>
  <footer id="foot" class="t-caption t-secondary">Searches tasks, files and photo descriptions on this box. Photos never leave it.</footer>
</main>
<script>
  // gurtos.js puts the pairing token on this page's fetches. An <img> cannot carry a header, so photos take it in the URL.
  let token = new URLSearchParams(location.search).get('access_token');
  try { token ??= JSON.parse(parent.localStorage.getItem('pairing') ?? 'null')?.token ?? null; } catch {}
  const withToken = (u) => (token ? `${u}&access_token=${encodeURIComponent(token)}` : u);
  const el = (tag, cls, text) => Object.assign(document.createElement(tag), cls ? { className: cls } : {}, text != null ? { textContent: text } : {});
  const body = (r) => r.text.replace(/^[^:]*: /, ''); // a file's doc starts with "<workspace>/<path>: "
  const BADGE = { done: 'g-badge-success', failed: 'g-badge-destructive', undone: 'g-badge-neutral' };
  const $ = (id) => document.getElementById(id);

  function status(title, text, icon = 'system-search') {
    const s = el('div', 'g-status');
    const i = el('g-icon');
    i.setAttribute('name', icon);
    i.setAttribute('size', '64');
    s.append(i, el('div', 'g-status-title', title), el('div', 'g-status-body', text));
    $('results').replaceChildren(s);
  }

  function row(r) {
    const div = el('div', 'g-row');
    const text = el('div', 'g-row-text');
    if (r.kind === 'task') {
      const [, title = r.task, state = r.state] = r.text.match(/^Task "(.*)" \((\w+)\)/) || [];
      text.append(el('div', 'g-row-title', r.title || title), el('div', 'g-row-sub', `${r.source || 'task'} · task ${r.task}`));
      const trail = el('span', 'g-row-trail');
      trail.append(el('span', `g-badge ${BADGE[state] || 'g-badge-neutral'}`, state));
      div.append(text, trail);
    } else {
      text.append(el('div', 'g-row-title t-mono', `${r.workspace}/${r.path}`), el('div', 'g-row-sub', body(r).slice(0, 160)));
      div.append(text);
    }
    return div;
  }

  function photo(r) {
    const card = el('div', 'g-card');
    const img = el('img');
    img.src = withToken(`/t/find/file?workspace=${encodeURIComponent(r.workspace)}&path=${encodeURIComponent(r.path)}`);
    img.alt = body(r).split('. ')[0];
    img.loading = 'lazy';
    card.append(img, el('p', 't-caption t-mono', `${r.workspace}/${r.path}`), el('p', 't-caption t-secondary', `Described by ${r.model || 'a model'}`));
    return card;
  }

  function render(d, q) {
    if (!d.results.length) status('Nothing found', `No photo, file or task on this box matches "${q}".`);
    else $('results').replaceChildren();
    for (const [kind, label] of [['task', 'Tasks'], ['file', 'Files'], ['photo', 'Photos']]) {
      const hits = d.results.filter((r) => r.kind === kind);
      if (!hits.length) continue;
      const group = el('section', 'g-group');
      const head = el('div', 'g-group-head');
      head.append(el('h2', 'g-group-title', label));
      const list = el('div', kind === 'photo' ? 'photos' : 'g-list');
      list.append(...hits.map(kind === 'photo' ? photo : row));
      group.append(head, list);
      $('results').append(group);
    }
    const by = d.index === 'moss' ? `Moss, in ${d.ms < 1 ? 'under 1' : d.ms} ms (${Math.round(d.wallMs)} ms on the box)` : d.index;
    $('foot').textContent = `Answered by ${by}. ${d.cloud}.`;
  }

  let timer, seq = 0;
  async function search() {
    const q = $('q').value.trim();
    if (!q) return;
    const mine = ++seq;
    try {
      const r = await fetch(`/t/find/search?q=${encodeURIComponent(q)}&k=12`);
      const d = await r.json();
      if (mine !== seq) return; // a newer search is on its way
      if (!r.ok) throw new Error(r.status === 401 ? 'Pair this device with the box first.' : d.error || `HTTP ${r.status}`);
      render(d, q);
    } catch (e) {
      status('The box did not answer', String(e.message), 'dialog-warning');
    }
  }
  $('form').addEventListener('submit', (e) => (e.preventDefault(), search()));
  $('q').addEventListener('input', () => (clearTimeout(timer), (timer = setTimeout(search, 250))));
  status('Search this box', 'Photos by what is in them, text files, and past tasks.');
  // Photos no model on this box could describe. Claude describes them only when you ask: it uses your model key.
  fetch('/t/find/status').then((r) => r.json()).then((s) => {
    if (!s.undescribed) return;
    $('describe-text').textContent = `${s.undescribed} photo${s.undescribed > 1 ? 's are' : ' is'} not described yet, so search cannot find ${s.undescribed > 1 ? 'them' : 'it'} by what is in ${s.undescribed > 1 ? 'them' : 'it'}.`;
    $('describe').hidden = false;
  }).catch(() => {});
  $('describe-btn').addEventListener('click', async () => {
    const r = await fetch('/t/find/describe', { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    $('describe-text').textContent = r.ok ? 'Claude is describing them in a task. Watch it in Tasks; search finds them when it is done.' : d.error || `HTTP ${r.status}`;
    $('describe-btn').hidden = true;
  });
  const start = new URLSearchParams(location.search).get('q');
  if (start) ($('q').value = start), search();
</script>
</body>
</html>
