<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="approval-title approval-desc">
  <title id="approval-title">How a task pauses for your OK</title>
  <desc id="approval-desc">A task calls a tool that would spend more than its remaining budget. The core writes approval.asked and the task waits while other tasks keep running. The request reaches the portal, the phone and any connected app. The first answer wins and is logged as approval.answered. If approved, the tool runs once and its result and cost go into the log. If no answer comes within 150 seconds, the call returns pending and the worker calls again, reusing the same approval.</desc>
  <defs>
    <marker id="approval-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="arrowhead"/>
    </marker>
  </defs>

  <rect x="40" y="20" width="160" height="44" rx="6" class="node-strong"/>
  <text x="120" y="47" text-anchor="middle">The task</text>
  <rect x="300" y="20" width="160" height="44" rx="6" class="node-strong"/>
  <text x="380" y="47" text-anchor="middle">The core</text>
  <rect x="560" y="20" width="160" height="44" rx="6" class="node-strong"/>
  <text x="640" y="40" text-anchor="middle">You</text>
  <text x="640" y="56" text-anchor="middle" class="muted">portal, phone, apps</text>

  <path d="M120 64V364M380 64V364M640 64V364" class="zone"/>

  <path d="M122 100H376" class="line" marker-end="url(#approval-arrow)"/>
  <text x="130" y="92" class="muted">POST /call: a tool that costs $3.00</text>

  <rect x="392" y="112" width="250" height="40" rx="6" class="node"/>
  <text x="404" y="137" class="muted">$3.00 is more than the $2.00 left</text>

  <path d="M382 176H636" class="line" marker-end="url(#approval-arrow)"/>
  <text x="392" y="168" class="muted mono">approval.asked</text>

  <rect x="20" y="188" width="200" height="56" rx="6" class="accent"/>
  <text x="32" y="211">Waiting for OK</text>
  <text x="32" y="232" class="muted">other tasks keep running</text>

  <path d="M638 270H384" class="line" marker-end="url(#approval-arrow)"/>
  <text x="472" y="262" class="muted">Approve: first answer wins</text>

  <rect x="392" y="282" width="250" height="40" rx="6" class="node"/>
  <text x="404" y="307" class="muted mono">approval.answered</text>

  <path d="M378 350H124" class="line" marker-end="url(#approval-arrow)"/>
  <text x="140" y="342" class="muted">the tool runs once; result and cost logged</text>

  <text x="20" y="392" class="muted">No answer within 150 s: the call returns "pending" and the worker calls again.</text>
  <text x="20" y="412" class="muted">The retry reuses the same approval, so it is asked, run and charged once.</text>
</svg>
